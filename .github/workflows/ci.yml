name: Teacher baseline checks
on:
  push:
    branches: [main, 'feature/**', 'migration/**']
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Dspring.profiles.active=test test
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: docs/M1/prototype
      - run: npm test && npm run build
        working-directory: docs/M1/prototype
      - run: npx playwright install --with-deps chromium
        working-directory: docs/M1/prototype
      - run: |
          npm run preview > /tmp/m1-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5187/ > /dev/null; then break; fi
            sleep 1
          done
          M1_BROWSER=chromium npm run verify:browser
        working-directory: docs/M1/prototype
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-evidence
          path: docs/M1/evidence

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/verify-capacity-evidence.py docs/M3/evidence/05-capacity
      - run: python3 scripts/verify-m3-delivery.py
