name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Existing frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Business and JWT unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Full Spring context needs MySQL; isolated unit tests do not.
      - run: mvn -B -Dtest=EvaluationServiceImplTest,JwtUtilTest test

  m1:
    name: M1 rules, build and browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/M1/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/M1/prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify browser interactions
        env:
          M1_BROWSER: chromium
        run: |
          npm run preview > /tmp/campus-m1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5181 > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-evidence
          path: docs/M1/evidence/
