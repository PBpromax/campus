server:
  port: ${SERVER_PORT:8080}
spring:
  flyway:
    enabled: false # Only deployment profile owns versioned migrations; developer/test DBs stay explicit.
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/campus_help?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000ms
jwt:
  secret: ${JWT_SECRET}
  expire-time: ${JWT_EXPIRE_TIME:86400000}
sms:
  enabled: ${SMS_ENABLED:false}
  aliyun:
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:}
    template-code: ${SMS_TEMPLATE_CODE:}
demo:
  seed-enabled: ${DEMO_SEED_ENABLED:false}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  deadline-ms: ${MODEL_DEADLINE_MS:45000}

model-gateway:
  max-concurrent: ${MODEL_MAX_CONCURRENT:4}

task-preview:
  binary: ${TASK_PREVIEW_BINARY:}
  runtime: ${TASK_PREVIEW_RUNTIME:}
  timeout-ms: ${TASK_PREVIEW_TIMEOUT_MS:3000}

model-controls:
  failure-threshold: ${MODEL_FAILURE_THRESHOLD:3}
  circuit-open-ms: ${MODEL_CIRCUIT_OPEN_MS:30000}
  user-calls-per-day: ${MODEL_USER_CALLS_PER_DAY:20}
  global-calls-per-day: ${MODEL_GLOBAL_CALLS_PER_DAY:100}
  user-tokens-per-day: ${MODEL_USER_TOKENS_PER_DAY:2000000}
  global-tokens-per-day: ${MODEL_GLOBAL_TOKENS_PER_DAY:10000000}
  user-usd-per-day: ${MODEL_USER_USD_PER_DAY:0.50}
  global-usd-per-day: ${MODEL_GLOBAL_USD_PER_DAY:2.00}
  input-hit-usd-per-million: ${MODEL_INPUT_HIT_USD_PER_MILLION:0.006}
  input-miss-usd-per-million: ${MODEL_INPUT_MISS_USD_PER_MILLION:0.30}
  output-usd-per-million: ${MODEL_OUTPUT_USD_PER_MILLION:1.20}
  priced-model: ${MODEL_PRICED_MODEL:deepseek-flash}
  price-version: ${MODEL_PRICE_VERSION:deepseek-flash-20261024-peak-usd}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false # Redis is not a business dependency in this release.
